<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaderboard</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{font-size:clamp(16px,1.4vw,30px)}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 30%,#17181d,#050506 80%) fixed;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
.s{position:fixed;left:-20%;width:140%;height:3px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--c),transparent) 0 0/28% 100% no-repeat,linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 40%,transparent),transparent);filter:drop-shadow(0 0 6px var(--c));animation:sw 5s ease-in-out infinite alternate}
@keyframes sw{to{background-position:100% 0,0 0}}
#bar{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
#bar a,#bar button{font:inherit;font-size:14px;font-weight:700;color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 14px;backdrop-filter:blur(6px)}
main{position:relative;max-width:1100px;margin:0 auto;padding:64px 16px 28px}
h1{margin:0 0 14px;text-align:center;font-size:clamp(30px,5vw,56px);font-weight:800;letter-spacing:-.5px}
.g{background:linear-gradient(90deg,#3b6cff,#7aa7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
#tabs button{font:inherit;font-weight:700;font-size:15px;color:#c3c7d0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 16px}
#tabs button.on{color:#fff;background:#3b6cff;border-color:#3b6cff;box-shadow:0 6px 20px rgba(59,108,255,.45)}
#cols{display:grid;grid-template-columns:1fr;gap:16px}
.col{display:none;padding:16px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);backdrop-filter:blur(6px)}
.col.on{display:block}
.col h2{margin:0 0 8px;font-size:1.2rem}
.r{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.1);font-size:1.15rem}
.r:last-child{border:0}
.k{width:2.2rem;text-align:center;flex:none;color:#c3c7d0;font-weight:700}
.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r b{font-size:1.3rem}
.t1{color:#ffc933;font-weight:800}
.em{padding:24px 8px;text-align:center;color:#c3c7d0}
#up{margin-top:16px;text-align:center;font-size:13px;color:#8a8f99}
@media(min-width:900px){#tabs{display:none}#cols{grid-template-columns:1fr 1fr}.col{display:block}}
</style></head><body>
<i class="s" style="top:14%;transform:rotate(-7deg);--c:#3b6cff;animation-duration:4.6s"></i>
<i class="s" style="top:38%;transform:rotate(6deg);--c:#ff8a2b;animation-duration:5.4s;animation-delay:-1.5s"></i>
<i class="s" style="top:66%;transform:rotate(-5deg);--c:#19c7b8;animation-duration:6.2s;animation-delay:-3s"></i>
<i class="s" style="top:86%;transform:rotate(5deg);--c:#a64bff;animation-duration:5s;animation-delay:-2s"></i>
<div id="bar"><a id="bk" href="index.html">← Menu</a><span><button id="fs">⛶</button> <button id="lg">TR</button></span></div>
<main><h1 id="h"></h1><div id="tabs"></div><div id="cols"></div><div id="up"></div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbygY3PecJUu082Uj-QgJH05b1hi_ACGj3YFRE1WKhpVHfNndE79sU97mYQ3hD2JXR8/exec';
const G=['catch','tower'];
const T={en:{h:'<span class="g">Leaderboard</span>',n:{catch:'Catch the Toolhead',tower:'Layer by Layer'},u:'Updated',e:'No scores yet. Be the first!',x:'Could not load scores. Retrying…',b:'← Menu'},
tr:{h:'<span class="g">Skor</span> Tablosu',n:{catch:'Toolhead Yakala',tower:'Katman Katman'},u:'Güncellendi',e:'Henüz skor yok. İlk sen ol!',x:'Skorlar yüklenemedi, tekrar deneniyor…',b:'← Menü'}};
let L='en',cur='catch',data={},err=false,ts=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function draw(){const t=T[L];
$('h').innerHTML=t.h;$('bk').textContent=t.b;$('lg').textContent=L=='tr'?'EN':'TR';
$('tabs').innerHTML=G.map(g=>'<button data-g="'+g+'" class="'+(g==cur?'on':'')+'">'+t.n[g]+'</button>').join('');
$('cols').innerHTML=G.map(g=>{const a=data[g];let rows;
if(!a)rows='<div class="em">'+(err?t.x:'…')+'</div>';
else if(!a.length)rows='<div class="em">'+t.e+'</div>';
else rows=a.slice(0,10).map((r,i)=>'<div class="r'+(i==0?' t1':'')+'"><span class="k">'+(['🥇','🥈','🥉'][i]||(i+1))+'</span><span class="n">'+esc(r.n)+'</span><b>'+esc(r.s)+'</b></div>').join('');
return '<section class="col'+(g==cur?' on':'')+'"><h2>'+t.n[g]+'</h2>'+rows+'</section>'}).join('');
$('up').textContent=ts?t.u+' '+new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}):''}
async function load(){try{await Promise.all(G.map(async g=>{const r=await fetch(API+'?game='+g+'&t='+Date.now(),{cache:'no-store'});const d=await r.json();if(!Array.isArray(d))throw 0;data[g]=d}));err=false;ts=Date.now()}catch(_){err=true}draw()}
$('tabs').onclick=e=>{const g=e.target.dataset&&e.target.dataset.g;if(g){cur=g;draw()}};
$('lg').onclick=()=>{L=L=='tr'?'en':'tr';draw()};
$('fs').onclick=()=>{const d=document.documentElement;try{document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()}catch(_){}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
setInterval(()=>{if(!document.hidden)load()},10000);
draw();load();
</script></body></html>
