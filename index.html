<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catch the Toolhead</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;height:100%;margin:0;background:#0a0a0b;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
.p{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 18px;font-weight:800;font-size:20px;backdrop-filter:blur(6px)}
.p.r{background:rgba(224,49,49,.3);border-color:#e03131}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,8,10,.8);backdrop-filter:blur(3px);text-align:center;padding:24px}
#ov h1{margin:10px 0 6px;font-size:clamp(28px,8vw,40px);font-weight:800;letter-spacing:-.5px;line-height:1.1}
#ov p{margin:4px 0 22px;font-size:16px;line-height:1.5;color:#c3c7d0;max-width:340px}
.g{background:linear-gradient(90deg,#3b6cff,#7aa7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#go{font:inherit;font-size:19px;font-weight:700;padding:15px 34px;border:0;border-radius:14px;background:#3b6cff;color:#fff;box-shadow:0 8px 30px rgba(59,108,255,.45)}
#lg{margin-top:16px;font:inherit;font-size:13px;font-weight:700;color:#c3c7d0;background:none;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 12px}
svg{width:min(66vw,280px);height:auto;animation:f 3s ease-in-out infinite}
@keyframes f{50%{transform:translateY(-6px)}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span class="p" id="sc">0 / 30</span><span class="p" id="tm">15</span></div>
<div id="ov"></div>
<script>
const GOAL=30,TIME=15,LED=['#3b6cff','#ff8a2b','#19c7b8','#a64bff'];
const S=[['#3b6cff',.25,.1,.4,.2],['#ff8a2b',.45,.6,.3,.5],['#19c7b8',.7,.8,.6,.75],['#a64bff',.88,.95,.8,.9]];
const T={en:{t:'Catch the <span class="g">Toolhead</span>',d:'Catch 30 toolheads in 15 seconds.<br>Drag your finger to move the bed.<br>Avoid the red X balls, they cost you 2 points!<br>Golden toolheads count double!',s:'Start',w:'You did it! 🎉',l:'Time’s up',c:n=>'You caught '+n+' / 30 toolheads.',r:'Try again!',p:'Play again'},
tr:{t:'<span class="g">Toolhead</span> Yakala',d:'15 saniyede 30 toolhead yakala.<br>Parmağınla yatağı sürükle.<br>Kırmızı X toplarından kaç, 2 puan kaybedersin!<br>Altın toolhead çift puan!',s:'Başla',w:'Başardın! 🎉',l:'Süre doldu',c:n=>n+' / 30 toolhead yakaladın.',r:'Bir daha dene!',p:'Tekrar oyna'}};
const PR=`<svg viewBox="0 0 220 150" stroke="#fff" stroke-width="3" stroke-linejoin="round"><rect x="30" y="118" width="160" height="22" rx="8" fill="#e6e8ec"/><rect x="44" y="20" width="10" height="98" rx="3" fill="#cfd3da"/><rect x="166" y="20" width="10" height="98" rx="3" fill="#cfd3da"/><rect x="40" y="12" width="140" height="12" rx="4" fill="#cfd3da"/><circle cx="26" cy="62" r="16" fill="#3b6cff"/><circle cx="194" cy="62" r="16" fill="#ff8a2b"/><circle cx="26" cy="62" r="4" fill="#0a0a0b"/><circle cx="194" cy="62" r="4" fill="#0a0a0b"/><rect x="54" y="46" width="112" height="9" rx="3" fill="#cfd3da"/><rect x="48" y="112" width="124" height="8" rx="3" fill="#9aa0ab"/><g stroke-width="2.5"><path d="M82 88l28 12v14l-28-12z" fill="#3b6cff"/><path d="M110 100l28-12v14l-28 12z" fill="#e8453c"/><path d="M110 76l28 12-28 12-28-12z" fill="#ffc933"/></g><g fill="#16161a"><rect x="60" y="40" width="16" height="34" rx="5"/><rect x="84" y="40" width="16" height="34" rx="5"/><rect x="120" y="40" width="16" height="34" rx="5"/><rect x="144" y="40" width="16" height="34" rx="5"/></g><g stroke="none"><rect x="63" y="68" width="10" height="3" fill="#3b6cff"/><rect x="87" y="68" width="10" height="3" fill="#ff8a2b"/><rect x="123" y="68" width="10" height="3" fill="#19c7b8"/><rect x="147" y="68" width="10" height="3" fill="#a64bff"/></g></svg>`;
let run=false,items=[],caught=0,left=TIME,px=0,spawn=0,last=0,fl=0,mode=0,W,H,D,oc;
let L='en';
const cv=document.getElementById('c'),x=cv.getContext('2d'),ov=document.getElementById('ov'),sc=document.getElementById('sc'),tm=document.getElementById('tm');
function bg(){oc=document.createElement('canvas');oc.width=W*D;oc.height=H*D;const o=oc.getContext('2d');o.scale(D,D);
const g=o.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H));g.addColorStop(0,'#17181d');g.addColorStop(1,'#050506');o.fillStyle=g;o.fillRect(0,0,W,H);
o.lineWidth=3;o.lineCap='round';
for(const[c,a,b,d,e]of S){const l=o.createLinearGradient(0,0,W,0);l.addColorStop(0,c+'00');l.addColorStop(.5,c+'dd');l.addColorStop(1,c+'00');o.strokeStyle=l;o.shadowColor=c;o.shadowBlur=18;o.beginPath();o.moveTo(-W*.1,a*H);o.bezierCurveTo(W*.3,b*H,W*.6,d*H,W*1.1,e*H);o.stroke()}}
function rs(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);bg();if(!run)x.drawImage(oc,0,0,W,H)}
rs();addEventListener('resize',rs);
function show(m){mode=m;const t=T[L],w=caught>=GOAL;
ov.innerHTML=(m?'':PR)+'<h1>'+(m?(w?t.w:t.l):t.t)+'</h1><p>'+(m?t.c(caught)+(w?'':'<br>'+t.r):t.d)+'</p><button id="go">'+(m?t.p:t.s)+'</button><button id="lg">'+(L=='tr'?'EN':'TR')+'</button>';ov.style.display='flex'}
ov.onclick=e=>{if(e.target.id=='go')start();if(e.target.id=='lg'){L=L=='tr'?'en':'tr';show(mode)}};
show(0);
function start(){items=[];caught=0;left=TIME;px=W/2;spawn=0;fl=0;last=performance.now();run=true;ov.style.display='none';sc.textContent='0 / '+GOAL;requestAnimationFrame(loop)}
function mv(e){const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;if(t&&t.clientX!=null)px=t.clientX}
['touchstart','touchmove'].forEach(n=>addEventListener(n,e=>{mv(e);if(run&&e.cancelable)e.preventDefault()},{passive:false}));['pointerdown','pointermove','mousedown','mousemove'].forEach(n=>addEventListener(n,mv));
function rr(c,a,b,w,h,r){c.beginPath();c.roundRect(a,b,w,h,r)}
function head(c,w,h,led,g){c.lineJoin='round';c.lineWidth=Math.max(2.5,w*.07);c.strokeStyle='#fff';
c.fillStyle=g?'rgba(255,201,51,.55)':'rgba(59,108,255,.4)';rr(c,-w/2+w*.09,-h/2+h*.04,w,h,w*.22);c.fill();
c.strokeStyle='#555';c.beginPath();c.moveTo(0,-h/2);c.quadraticCurveTo(w*.6,-h*.65,w*.15,-h*.85);c.stroke();
c.strokeStyle='#fff';c.fillStyle=g?'#ffc933':'#16161a';rr(c,-w/2,-h/2,w,h,w*.22);c.fill();c.stroke();
c.fillStyle='#8a8f99';rr(c,-w*.16,-h*.3,w*.32,h*.045,2);c.fill();
c.fillStyle=led;rr(c,-w*.3,h*.33,w*.6,h*.05,3);c.fill();
c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.beginPath();c.moveTo(-w*.3,-h*.15);c.lineTo(-w*.3,h*.2);c.stroke();if(g){c.fillStyle='#16161a';c.font='bold '+Math.round(w*.42)+'px system-ui';c.textAlign='center';c.fillText('x2',0,h*.18)}}
function loop(n){if(!run)return;const dt=Math.min(.05,(n-last)/1000);last=n;left-=dt;
const iw=Math.min(54,W*.14),ih=iw*1.7,tw=Math.min(120,W*.3)*(1-Math.min(caught,30)*.012),th=16,ty=H-th-40;
spawn-=dt;if(spawn<=0){spawn=.25+Math.random()*.15;const x0=iw/2+Math.random()*(W-iw),tr=Math.random()<.2,go=!tr&&Math.random()<.1;items.push({x:x0,x0:x0,y:-ih*1.3,v:H*(.7+Math.random()*.3)*(1+caught*.045)*(go?1.3:1),r:(Math.random()-.5)*.5,t:tr,g:go,a:(go||(!tr&&Math.random()<.4))?W*(.06+Math.random()*.08):0,ph:Math.random()*6,c:LED[Math.floor(Math.random()*4)]})}
x.drawImage(oc,0,0,W,H);
for(const it of items){it.y+=it.v*dt;if(it.a)it.x=Math.max(iw/2,Math.min(W-iw/2,it.x0+Math.sin(it.y*.012+it.ph)*it.a));
if(!it.d&&it.y+ih>=ty&&it.y<ty+th&&Math.abs(it.x-px)<tw/2+iw/3){it.d=1;if(it.t){caught=Math.max(0,caught-2);fl=.35;if(navigator.vibrate)navigator.vibrate(80)}else caught+=it.g?2:1;sc.textContent=caught+' / '+GOAL}
if(!it.d){x.save();if(it.t){x.translate(it.x,it.y+ih-iw*.5);x.fillStyle='#e03131';x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(0,0,iw*.5,0,7);x.fill();x.stroke();x.beginPath();x.moveTo(-9,-9);x.lineTo(9,9);x.moveTo(9,-9);x.lineTo(-9,9);x.stroke()}else{x.translate(it.x,it.y+ih/2);x.rotate(it.r);head(x,iw,ih,it.c,it.g)}x.restore()}}
items=items.filter(i=>!i.d&&i.y<H+ih*2);
px=Math.max(tw/2,Math.min(W-tw/2,px));fl-=dt;
x.save();x.shadowColor=fl>0?'#e03131':'#3b6cff';x.shadowBlur=16;x.fillStyle=fl>0?'#f08080':'#d8dbe2';x.strokeStyle='#fff';x.lineWidth=3;rr(x,px-tw/2,ty,tw,th,8);x.fill();x.stroke();x.restore();
x.fillStyle='#9aa0ab';rr(x,px-tw/2+6,ty+th*.55,tw-12,th*.28,3);x.fill();
const s=Math.max(0,Math.ceil(left));tm.textContent=s;tm.className=left<=5?'p r':'p';
if(caught>=GOAL||left<=0){run=false;return show(1)}
requestAnimationFrame(loop)}
</script></body></html>
